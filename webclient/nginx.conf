# Front de MedProtect: sirve la página estática y reenvía /api/ a la API, en el mismo origen.
# Corre sin root, así que escucha en el 8080 (un puerto bajo pediría privilegios).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 64k;

    # El nombre "api" lo resuelve el DNS de Docker. Con variable se resuelve en cada petición: si la API se
    # reinicia y cambia de IP, nginx la sigue encontrando.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api:8080;

    # Cabeceras de seguridad en todas las respuestas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
